services:
  - type: web
    name: dsa-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: API_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RAG_LLM_MODEL
        value: gpt-4.1-mini
      - key: RAG_EMBED_MODEL
        value: text-embedding-3-small
