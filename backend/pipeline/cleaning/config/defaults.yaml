# ------------------------------------------------------------------
# Table schemas (aligned to new 12-CSV data generation)
# ------------------------------------------------------------------
tables:

  # =========================
  # 1. customers.csv
  # =========================
  customers:
    required: [customer_id, acquisition_date]
    recommended:
      - name
      - email
      - age
      - gender
      - location
      - device_type
      - loyalty_status
      - total_spend

    aliases:
      customer_id: [customer_id, cust_id, user_id]
      name: [name, full_name, customer_name]
      email: [email, email_address]
      age: [age, customer_age]
      gender: [gender, sex]
      location: [location, city_region_country, city]
      device_type: [device_type, device, platform]
      loyalty_status: [loyalty_status, loyalty_tier, tier]
      total_spend: [total_spend, lifetime_value, ltv]
      acquisition_date: [acquisition_date, signup_date, joined_at, account_creation_date]

    dtypes:
      customer_id: string
      name: string
      email: string
      age: Int64
      gender: string
      location: string
      device_type: string
      loyalty_status: string
      total_spend: float
      acquisition_date: datetime64[ns]

    primary_key: [customer_id]

    outlier_cols:
      - age
      - total_spend

    business_rules:
      - "total_spend>=0"
      - "age>=0"


  # =========================
  # 2. products.csv
  # =========================
  products:
    required: [sku, product_name, category, retail_price]
    recommended:
      - brand
      - cost_price
      - profit_margin
      - discount_percent
      - average_rating

    aliases:
      sku: [sku, product_id, item_code]
      product_name: [product_name, name, title]
      category: [category, cat]
      brand: [brand, manufacturer]
      cost_price: [cost_price, cogs, wholesale_price]
      retail_price: [retail_price, price, msrp]
      profit_margin: [profit_margin, margin]
      discount_percent: [discount_percent, discount_pct, discount]
      average_rating: [average_rating, rating, review_score, stars]

    dtypes:
      sku: string
      product_name: string
      category: string
      brand: string
      cost_price: float
      retail_price: float
      profit_margin: float
      discount_percent: float
      average_rating: float

    primary_key: [sku]

    outlier_cols:
      - retail_price
      - cost_price
      - average_rating

    business_rules:
      - "retail_price>=0"
      - "cost_price>=0"
      - "discount_percent>=0"
      - "average_rating>=1"
      - "average_rating<=5"


  # =========================
  # 3. inventory.csv
  # =========================
  inventory:
    required: [sku, stock_quantity, reorder_level, warehouse_location]
    recommended:
      - supplier

    aliases:
      sku: [sku, product_id, item_code]
      stock_quantity: [stock_quantity, quantity_available, on_hand, stock, stock_level]
      reorder_level: [reorder_level, reorder_threshold, rop, reorder_point]
      warehouse_location: [warehouse_location, warehouse, wh, location]
      supplier: [supplier, vendor, distributor]

    dtypes:
      sku: string
      stock_quantity: float
      reorder_level: float
      warehouse_location: string
      supplier: string

    primary_key: [sku]

    outlier_cols:
      - stock_quantity
      - reorder_level

    business_rules:
      - "stock_quantity>=0"
      - "reorder_level>=0"


  # =========================
  # 4. transactions.csv
  # =========================
  transactions:
    required:
      [order_id, customer_id, sku, quantity, unit_price, total_amount, order_datetime]
    recommended:
      - discount_amount
      - order_status

    aliases:
      order_id: [order_id, transaction_id, txn_id]
      customer_id: [customer_id, cust_id, user_id]
      sku: [sku, product_id, item_code]
      quantity: [quantity, qty, units]
      unit_price: [unit_price, price_per_unit, sell_price]
      total_amount: [total_amount, line_amount, extended_price]
      discount_amount: [discount_amount, discount, discount_value]
      order_status: [order_status, status]
      order_datetime: [order_datetime, timestamp, date, sold_at, transaction_date]

    dtypes:
      order_id: string
      customer_id: string
      sku: string
      quantity: float
      unit_price: float
      total_amount: float
      discount_amount: float
      order_status: string
      order_datetime: datetime64[ns]

    primary_key: [order_id, sku]

    outlier_cols:
      - quantity
      - unit_price
      - total_amount
      - discount_amount

    business_rules:
      - "quantity>=0"
      - "unit_price>=0"
      - "total_amount>=0"
      - "discount_amount>=0"


  # =========================
  # 5. transactions_with_session.csv
  # =========================
  transactions_with_session:
    required:
      [order_id, customer_id, sku, quantity, unit_price, total_amount, order_datetime, session_id]
    recommended:
      - discount_amount
      - order_status

    aliases:
      order_id: [order_id, transaction_id, txn_id]
      customer_id: [customer_id, cust_id, user_id]
      sku: [sku, product_id, item_code]
      quantity: [quantity, qty, units]
      unit_price: [unit_price, price_per_unit, sell_price]
      total_amount: [total_amount, line_amount, extended_price]
      discount_amount: [discount_amount, discount, discount_value]
      order_status: [order_status, status]
      order_datetime: [order_datetime, timestamp, date, sold_at]
      session_id: [session_id, sess_id]

    dtypes:
      order_id: string
      customer_id: string
      sku: string
      quantity: float
      unit_price: float
      total_amount: float
      discount_amount: float
      order_status: string
      order_datetime: datetime64[ns]
      session_id: string

    primary_key: [order_id, sku]

    outlier_cols:
      - quantity
      - unit_price
      - total_amount
      - discount_amount

    business_rules:
      - "quantity>=0"
      - "unit_price>=0"
      - "total_amount>=0"
      - "discount_amount>=0"


  # =========================
  # 6. payments.csv
  # =========================
  payments:
    required: [order_id, payment_method, payment_status, transaction_fee, currency]
    aliases:
      order_id: [order_id, transaction_id, txn_id]
      payment_method: [payment_method, method, pay_type, tender_type]
      payment_status: [payment_status, status]
      transaction_fee: [transaction_fee, fee, processing_fee]
      currency: [currency, curr, ccy]

    dtypes:
      order_id: string
      payment_method: string
      payment_status: string
      transaction_fee: float
      currency: string

    primary_key: [order_id]

    outlier_cols:
      - transaction_fee

    business_rules:
      - "transaction_fee>=0"


  # =========================
  # 7. marketing.csv
  # =========================
  marketing:
    required:
      [campaign_id, channel, campaign_type, campaign_name,
       start_date, end_date, ad_spend, impressions, clicks, conversions]
    aliases:
      campaign_id: [campaign_id, cmp_id]
      channel: [channel, marketing_channel]
      campaign_type: [campaign_type, type]
      campaign_name: [campaign_name, name]
      start_date: [start_date, campaign_start]
      end_date: [end_date, campaign_end]
      ad_spend: [ad_spend, spend, cost, budget]
      impressions: [impressions, imps]
      clicks: [clicks]
      conversions: [conversions, conv, purchases]

    dtypes:
      campaign_id: string
      channel: string
      campaign_type: string
      campaign_name: string
      start_date: datetime64[ns]
      end_date: datetime64[ns]
      ad_spend: float
      impressions: float
      clicks: float
      conversions: float

    primary_key: [campaign_id]

    outlier_cols:
      - ad_spend
      - impressions
      - clicks
      - conversions

    business_rules:
      - "ad_spend>=0"
      - "impressions>=0"
      - "clicks>=0"
      - "conversions>=0"
      - "conversions<=clicks"
      - "clicks<=impressions"


  # =========================
  # 8. sessions.csv
  # =========================
  sessions:
    required:
      [session_id, customer_id, session_start, session_end,
       session_duration_sec, pages_viewed, device_type,
       landing_page, traffic_source, converted_flag, revenue]
    recommended:
      - campaign_name

    aliases:
      session_id: [session_id, sess_id]
      customer_id: [customer_id, cust_id, user_id]
      session_start: [session_start, start_time]
      session_end: [session_end, end_time]
      session_duration_sec: [session_duration_sec, duration_sec, session_time_sec]
      pages_viewed: [pages_viewed, pageviews, page_views]
      device_type: [device_type, device, platform]
      landing_page: [landing_page, entry_page]
      traffic_source: [traffic_source, source, channel]
      campaign_name: [campaign_name, campaign]
      converted_flag: [converted_flag, converted, is_converted]
      revenue: [revenue, session_revenue]

    dtypes:
      session_id: string
      customer_id: string
      session_start: datetime64[ns]
      session_end: datetime64[ns]
      session_duration_sec: float
      pages_viewed: float
      device_type: string
      landing_page: string
      traffic_source: string
      campaign_name: string
      converted_flag: boolean
      revenue: float

    primary_key: [session_id]

    outlier_cols:
      - session_duration_sec
      - pages_viewed
      - revenue

    business_rules:
      - "session_duration_sec>=0"
      - "pages_viewed>=0"
      - "revenue>=0"


  # =========================
  # 9. events.csv
  # =========================
  events:
    required:
      [event_id, session_id, customer_id, event_type, event_datetime]
    recommended:
      - sku
      - quantity
      - unit_price

    aliases:
      event_id: [event_id, evt_id]
      session_id: [session_id, sess_id]
      customer_id: [customer_id, cust_id, user_id]
      event_type: [event_type, type, action]
      event_datetime: [event_datetime, timestamp, event_time]
      sku: [sku, product_id, item_code]
      quantity: [quantity, qty]
      unit_price: [unit_price, price]

    dtypes:
      event_id: string
      session_id: string
      customer_id: string
      event_type: string
      event_datetime: datetime64[ns]
      sku: string
      quantity: float
      unit_price: float

    primary_key: [event_id]

    outlier_cols:
      - quantity
      - unit_price

    business_rules:
      - "quantity>=0"
      - "unit_price>=0"


  # =========================
  # 10. web_analytics.csv
  # =========================
  web_analytics:
    required:
      [event_id, session_id, customer_id, event_datetime,
       page_type, action, add_to_cart, referral_source]
    aliases:
      event_id: [event_id, web_event_id]
      session_id: [session_id, sess_id]
      customer_id: [customer_id, cust_id, user_id]
      event_datetime: [event_datetime, timestamp, event_time]
      page_type: [page_type, page]
      action: [action, event_action]
      add_to_cart: [add_to_cart, added_to_cart]
      referral_source: [referral_source, source, referral]

    dtypes:
      event_id: string
      session_id: string
      customer_id: string
      event_datetime: datetime64[ns]
      page_type: string
      action: string
      add_to_cart: boolean
      referral_source: string

    primary_key: [event_id]

    outlier_cols: []

    business_rules: []


  # =========================
  # 11. campaign_performance.csv
  # =========================
  campaign_performance:
    required:
      [date, campaign_id, channel, campaign_name,
       impressions, clicks, spend, sessions, orders, attributed_revenue]
    aliases:
      date: [date, day, report_date]
      campaign_id: [campaign_id, cmp_id]
      channel: [channel, marketing_channel]
      campaign_name: [campaign_name, name]
      impressions: [impressions, imps]
      clicks: [clicks]
      spend: [spend, cost, daily_spend]
      sessions: [sessions, session_count]
      orders: [orders, order_count]
      attributed_revenue: [attributed_revenue, revenue, attr_revenue]

    dtypes:
      date: datetime64[ns]
      campaign_id: string
      channel: string
      campaign_name: string
      impressions: float
      clicks: float
      spend: float
      sessions: float
      orders: float
      attributed_revenue: float

    primary_key: [date, campaign_id]

    outlier_cols:
      - impressions
      - clicks
      - spend
      - attributed_revenue

    business_rules:
      - "impressions>=0"
      - "clicks>=0"
      - "spend>=0"
      - "sessions>=0"
      - "orders>=0"
      - "attributed_revenue>=0"
      - "clicks<=impressions"


  # =========================
  # 12. funnel_summary.csv
  # =========================
  funnel_summary:
    required:
      [date, sessions, product_views, add_to_cart,
       checkout_started, purchases, conversion_rate, cart_abandonment_rate]
    aliases:
      date: [date, day, report_date]
      sessions: [sessions, session_count]
      product_views: [product_views, prod_views]
      add_to_cart: [add_to_cart, atc, cart_adds]
      checkout_started: [checkout_started, begin_checkout]
      purchases: [purchases, purchase_count]
      conversion_rate: [conversion_rate, conv_rate]
      cart_abandonment_rate: [cart_abandonment_rate, abandon_rate]

    dtypes:
      date: datetime64[ns]
      sessions: float
      product_views: float
      add_to_cart: float
      checkout_started: float
      purchases: float
      conversion_rate: float
      cart_abandonment_rate: float

    primary_key: [date]

    outlier_cols:
      - sessions
      - purchases

    business_rules:
      - "sessions>=0"
      - "product_views>=0"
      - "add_to_cart>=0"
      - "checkout_started>=0"
      - "purchases>=0"
      - "conversion_rate>=0"
      - "cart_abandonment_rate>=0"
